TRACKER_CAMERA_CALIBRATION_REPLACE: "新しいカメラキャリブレーションは、すでに保存されているものより悪いようです。\n\nそれでも保存済みのキャリブレーションを置き換える場合は OK、保存済みのものを残す場合はキャンセルを押してください。"
TRACKER_CAMERA_CALIBRATION_KEPT: "保存済みのカメラキャリブレーションを維持しました。"
CALIBRATION_FIRSTRUN_CAMERA: "カメラキャリブレーションがまだ行われていません。\n\nカメラを開始してから、charucoボードを使って「2. カメラをキャリブレーション」を一度だけ実行してください。\n結果は calib.yaml に保存され、次回以降の起動で自動的に読み込まれます。"
