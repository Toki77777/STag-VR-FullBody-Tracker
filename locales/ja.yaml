TRACKER_CAMERA_CALIBRATION_INSTRUCTIONS: "カメラのキャリブレーションを開始しました！\n\n印刷したCharucoキャリブレーションボードを平らな面に置くか、（曲面でない）モニターに表示してください。カメラは1秒ごとに画像を撮影します。できるだけ多くの角度と距離からボードを撮影してください。\n\nボードがはっきり見えていて、ぼやけていないことを確認してください。カメラはゆっくり動かしてください。\n\n紫の点 = 優秀\n緑の点 = 良好\n黄色の点 = 不良\n\nグリッドはほぼ平らで安定していて（数ピクセル程度の揺れは問題ありません）、画像全体を覆うようにしてください。\n点が画像全体にまんべんなく分布するようにしてください。\n\n完了したらOKを押してキャリブレーションを保存してください。"
TRACKER_CAMERA_CALIBRATION_COMPLETE: "キャリブレーションが完了しました。"
TRACKER_CAMERA_CALIBRATION_NOTDONE: "撮影された画像が少なすぎるため、キャリブレーションは完了しませんでした。"
TRACKER_CAMERA_NOTCALIBRATED: "カメラがキャリブレーションされていません"
TRACKER_TRACKER_CALIBRATION_INSTRUCTIONS: "トラッカーのキャリブレーションを開始しました！\n\nキャリブレーションの前に、トラッカーの数とマーカーのサイズ（黒い正方形の一辺を測定）を設定してください。トラッカーは完全に剛体で、マーカー自体もマーカー同士の接続部も曲がらないようにしてください（GitHubの画像を参考にしてください）。トラッカーを装着し、カメラから30cm以内に近づけてキャリブレーションを行ってください。\n\n緑: このマーカーはキャリブレーション済みで、他のマーカーのキャリブレーションに使用できます。\n青: このマーカーは使用中のどのトラッカーにも属していません。設定でトラッカーの数を増やす必要があるかもしれません。\n紫: このマーカーはカメラから遠すぎるためキャリブレーションできません。30cm以内に近づけてください。\n赤: 緑のマーカーが見えていないため、このマーカーはキャリブレーションできません。緑のマーカーが一緒に見えるまでトラッカーを回転させてください。\n黄: このマーカーはキャリブレーション中です。少しの間動かさないでください。\n\nすべてのトラッカーのすべてのマーカーが緑で表示されたら、OKを押してキャリブレーションを完了してください。"
